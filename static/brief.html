<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slipday landing-site brief</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { --ink:#16181d; --muted:#535a66; --line:#d5d9e0; --soft:#f3f5f8; --yes:#1d6b3a; --yes-bg:#e5f3ea;
          --no:#9b1c1c; --no-bg:#fbe9e9; --mid:#7a5a00; --mid-bg:#fbf3dc; --accent:#1f4e8c; }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body { margin: 0; background: #fff; color: var(--ink); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--soft); }
  .bar label { font-size:12px; color:var(--muted); display:flex; gap:4px; align-items:center; }
  .bar input { font:inherit; padding:3px 6px; border:1px solid var(--line); border-radius:4px; width:9em; background:#fff; color:var(--ink); }
  .bar input[name=slip] { width:4.5em; }
  .bar button, .bar a.btn { font:inherit; padding:5px 12px; border-radius:4px; border:1px solid var(--accent); background:#fff; color:var(--accent); cursor:pointer; text-decoration:none; }
  .bar button.primary { background:var(--accent); color:#fff; }
  .bar .sp { flex:1; }
  main { max-width: 960px; margin: 0 auto; padding: 14px 16px 30px; }
  header.top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; border-bottom:2px solid var(--ink); padding-bottom:6px; }
  header.top h1 { font-size:18px; margin:0; }
  header.top .meta { font-size:11px; color:var(--muted); text-align:right; }
  .q { font-size:14px; margin:8px 0 6px; }
  .q b { font-weight:650; }
  .verdicts { display:grid; grid-template-columns: 1.1fr 1fr 1fr 1fr; gap:6px; margin:6px 0 8px; }
  .v { border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  .v .k { font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .v .w { font-size:20px; font-weight:700; line-height:1.15; }
  .v .s { font-size:11.5px; color:var(--muted); }
  .yes { background:var(--yes-bg); border-color:#b8dcc4; } .yes .w { color:var(--yes); }
  .no { background:var(--no-bg); border-color:#efc2c2; } .no .w { color:var(--no); }
  .mid { background:var(--mid-bg); border-color:#ecd9a0; } .mid .w { color:var(--mid); }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:4px 18px; }
  section { break-inside: avoid; margin: 0 0 6px; }
  h2 { font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); margin:6px 0 2px; border-bottom:1px solid var(--line); padding-bottom:1px; }
  p { margin: 2px 0; }
  table { border-collapse: collapse; width:100%; font-size:11.5px; }
  th, td { text-align:left; padding:2px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-weight:600; color:var(--muted); font-size:10.5px; }
  ul.checks { margin:2px 0; padding-left:14px; font-size:11.5px; } ul.checks li { margin:0 0 1px; }
  td { }
  td.n, th.n { white-space:nowrap;  text-align:right; font-variant-numeric: tabular-nums; }
  .tag { display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:0 4px; border-radius:3px; border:1px solid currentColor; margin-right:4px; }
  .t-assumed { color:#7a5a00; } .t-illustrative { color:#7a3a9b; } .t-limit { color:#535a66; } .t-rule { color:#1f4e8c; }
  .small { font-size:10.5px; color:var(--muted); }
  ul.fine { margin:2px 0; padding-left:0; list-style:none; columns: 2; column-gap: 18px; font-size:10px; line-height:1.3; }
  ul.fine li { break-inside: avoid; margin:0 0 2px; }
  a { color: var(--accent); }
  .bad { color:var(--no); font-weight:600; } .good { color:var(--yes); font-weight:600; }
  #status { padding:20px 0; color:var(--muted); }
  footer { font-size:10px; color:var(--muted); border-top:1px solid var(--line); margin-top:6px; padding-top:3px; }
  @media screen and (max-width: 720px) { .verdicts { grid-template-columns: 1fr 1fr; } .grid { grid-template-columns: 1fr; } ul.fine { columns:1; } }
  .short { display:none; }
  @page { size: auto; margin: 8mm 9mm; }
  @media print {
    .bar, .noprint { display:none !important; }
    body { font-size: 7.7pt; line-height:1.2; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    main { max-width:none; padding:0; }
    header.top h1 { font-size: 13pt; }
    .q { font-size: 9.6pt; margin:4px 0; }
    .v { padding:3px 6px; } .v .w { font-size:12pt; } .v .s { font-size:7.6pt; } .v .k { font-size:7pt; }
    h2 { font-size:7.8pt; margin:4px 0 1px; }
    table { font-size:7.2pt; } th { font-size:6.6pt; } th, td { padding:0 3px; }
    .small { font-size:7.2pt; }
    ul.fine { font-size:6pt; line-height:1.15; columns:3; column-gap:10px; }
    .full { display:none; } .short { display:inline; }
    ul.checks { font-size:7pt; } .prov { display:none; }
    ul.fine.srcs { columns:3; }
    p.small.sent { display:none; }
    .tag { font-size:5.6pt; padding:0 2px; }
    footer { font-size:6.8pt; }
    a { color: var(--ink); text-decoration: none; }
    a.src::after { content: " " attr(href); color: var(--muted); word-break: break-all; }
  }
</style>
</head>
<body>
<form class="bar" id="form">
  <strong>Review-board brief</strong>
  <label>Site <input name="site" placeholder="site id"></label>
  <label>Lat <input name="lat" style="width:6em"></label>
  <label>Lon <input name="lon" style="width:6em"></label>
  <label>Landing <input name="date" placeholder="2026-11-18"></label>
  <label>Slip (days) <input name="slip" type="number" min="0" max="120"></label>
  <button type="submit">Update</button>
  <span class="sp"></span>
  <button type="button" class="primary" id="download">Download brief</button>
  <button type="button" id="json">JSON</button>
</form>
<main>
  <div id="status">Assembling the brief from the Slipday endpoints. The alternatives check can take up to two minutes the first time.</div>
  <div id="brief" hidden></div>
</main>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var form = document.getElementById('form');
  ['site', 'lat', 'lon', 'date', 'slip'].forEach(function (k) { if (params.get(k) != null) form.elements[k].value = params.get(k); });
  if (!params.get('site') && !params.get('lat')) form.elements.site.value = 'robust_pick';
  if (!params.get('date')) form.elements.date.value = '2026-11-18';
  if (!params.get('slip')) form.elements.slip.value = '3';

  var data = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function num(v, d) { return (v == null || v === '' || isNaN(v)) ? '–' : Number(v).toFixed(d == null ? 0 : d).replace(/\.0+$/, d ? '' : ''); }
  function pct(v) { return v == null ? '–' : Number(v).toFixed(1) + ' %'; }
  function day(iso) { if (!iso) return '–'; var d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }) + (iso.slice(11, 16) !== '00:00' ? ' ' + iso.slice(11, 16) + ' UTC' : ''); }
  function cls(w) { return w === 'yes' || w === 'flat' ? 'yes' : (w === 'no' || w === 'steep') ? 'no' : 'mid'; }
  function word(w) { return { yes: 'Yes', no: 'No', 'not sure': 'Not sure', flat: 'Yes', steep: 'No' }[w] || (w || '–'); }
  function latlon(lat, lon) { if (lat == null) return ''; return Math.abs(lat).toFixed(3) + '° ' + (lat < 0 ? 'S' : 'N') + ', ' + Math.abs(lon).toFixed(3) + '° ' + (lon < 0 ? 'W' : 'E'); }
  function query() {
    var q = new URLSearchParams();
    ['site', 'lat', 'lon', 'date', 'slip'].forEach(function (k) { var v = form.elements[k].value.trim(); if (v) q.set(k, v); });
    if (q.get('lat') && q.get('lon')) q.delete('site');
    return q;
  }
  function vs(need, have) { return have == null ? '–' : '<span class="' + (have >= need ? 'good' : 'bad') + '">' + num(have) + ' h</span>'; }

  function render(b) {
    var s = b.inputs.site, pc = b.verdict.power_and_contact, gr = b.verdict.ground, sm = b.slip_margin, h = b.hours;
    var n = b.inputs.need || {}, slip = b.inputs.slip_days, out = [];
    out.push('<header class="top"><div><h1>Landing-site brief: ' + esc(s.friendly_name || s.name) + '</h1>' +
      '<div class="small">' + esc(s.subtitle || latlon(s.lat, s.lon)) + (s.friendly_name && s.name !== s.friendly_name ? ' · ' + esc(s.name) : '') + '</div></div>' +
      '<div class="meta">Slipday · ' + esc(b.method_version) + '<br>made ' + esc(b.made_utc.replace('T', ' ').replace('Z', ' UTC')) + '</div></header>');
    out.push('<p class="q"><b>Question.</b> ' + esc(b.question) + '</p>');
    out.push('<p class="small"><b>Inputs:</b> site ' + esc(latlon(s.lat, s.lon)) + '; planned landing ' + day(b.inputs.landing_utc) +
      '; slip to defend ' + slip + ' d; need ' + num(n.sunlit_h) + ' sunlit h and ' + num(n.earth_h) + ' Earth-contact h in the first ' +
      num(b.inputs.window_days) + ' days' + (n.sun_at_touchdown ? ', Sun up at touchdown' : '') + (n.earth_at_touchdown ? ', Earth in view at touchdown' : '') +
      '; landing within ' + num(b.inputs.scatter_m) + ' m of the target (13 touchdown points).</p>');

    var atSlip = pc.at_slip || {};
    out.push('<div class="verdicts">' +
      '<div class="v ' + cls(b.answer.overall) + '"><div class="k">Answer</div><div class="w">' + esc(b.answer.word) + '</div><div class="s">power and contact through a ' + slip + '-day slip, and flat ground</div></div>' +
      '<div class="v ' + cls(pc.verdict) + '"><div class="k">Power and contact</div><div class="w">' + word(pc.verdict) + '</div><div class="s">on the planned date; at +' + slip + ' d: ' + word(atSlip.verdict) + '</div></div>' +
      '<div class="v ' + (gr.verdict ? cls(gr.verdict) : 'mid') + '"><div class="k">Ground</div><div class="w">' + esc(gr.word) + '</div><div class="s">' + esc(gr.headline || '') + '</div></div>' +
      '<div class="v ' + (sm.holds ? 'yes' : 'no') + '"><div class="k">Slip margin</div><div class="w">' + (sm.days == null ? '–' : (sm.days < 0 ? 'none' : sm.days + ' d')) + '</div><div class="s">' + (sm.holds ? 'covers' : 'does not cover') + ' the ' + slip + '-day slip asked</div></div></div>');
    out.push('<p class="small sent">' + esc((pc.sentences || []).join(' ')) + '</p>');

    out.push('<div class="grid">');
    // hours
    out.push('<section><h2>Sunlit and Earth-contact hours against the need</h2><table><tr><th>Landing</th><th class="n">Sunlit</th><th class="n">Earth contact</th><th class="n">Both</th></tr>' +
      '<tr><td>Planned, ' + day(h.planned.landing_utc) + '</td><td class="n">' + vs(h.need_sunlit_h, h.planned.sunlit_h) + '</td><td class="n">' + vs(h.need_earth_h, h.planned.earth_h) + '</td><td class="n">' + num(h.planned.usable_h) + ' h</td></tr>' +
      '<tr><td>After a ' + slip + '-day slip, ' + day(h.at_slip.landing_utc) + '</td><td class="n">' + vs(h.need_sunlit_h, h.at_slip.sunlit_h) + '</td><td class="n">' + vs(h.need_earth_h, h.at_slip.earth_h) + '</td><td class="n">' + num(h.at_slip.usable_h) + ' h</td></tr>' +
      '<tr><td class="small">Need</td><td class="n small">' + num(h.need_sunlit_h) + ' h</td><td class="n small">' + num(h.need_earth_h) + ' h</td><td></td></tr></table>');
    var ln = b.longest_night;
    out.push('<p><b>Longest night</b> (Sun not up, worst of 13 touchdown points, in the ' + num(h.window_days) + '-day window): ' +
      (ln.available ? num(ln.planned_h) + ' h planned, ' + num(ln.at_slip_h) + ' h after ' + slip + ' d; worst over the passing slip days ' + num((ln.worst_over_passing_days || {}).night_h) + ' h. Longest Earth outage: ' + num(ln.planned_outage_h) + ' h planned, ' + num(ln.at_slip_outage_h) + ' h after the slip.' : esc(ln.reason)) + '</p></section>');
    // windows
    var w = b.windows;
    out.push('<section><h2>Next launch windows</h2>' + (w.rows && w.rows.length ? '<table><tr><th>Window</th><th>Landing</th><th>Verdict</th><th class="n">Margin</th><th>What fails</th></tr>' +
      w.rows.map(function (r) { return '<tr><td>' + (r.k === 0 ? 'planned' : '+' + r.k + ' mo') + '</td><td>' + day(r.landing_utc) + '</td><td class="' + (r.verdict === 'yes' ? 'good' : r.verdict === 'no' ? 'bad' : '') + '">' + word(r.verdict) + '</td><td class="n">' + (r.verdict === 'yes' ? r.slip_margin_days + ' d' : '–') + '</td><td>' + (r.fails_on && r.fails_on.length ? esc(r.fails_on.join(', ')) : 'nothing') + '</td></tr>'; }).join('') + '</table>' : '<p>' + esc(w.reason) + '</p>') + '</section>');
    // slope
    var sl = b.slope, st = sl.steepest || {};
    out.push('<section><h2>Slope and safe-touchdown chance per lander class</h2><p>' + (sl.available ? 'Steepest of the 13 touchdown points: <b>' + num(st.slope_deg, 1) + '°</b> (' + esc(st.point) + '), ' + sl.points_passing + ' of ' + sl.points_total + ' within NASA\'s ' + num(sl.limit_deg) + '° limit; ' + esc(sl.grid_words) + '.' : esc(sl.reason)) + '</p>' +
      (sl.classes.length ? '<table><tr><th>Lander class <span class="tag t-assumed">assumed</span></th><th class="n">99 % within</th><th class="n">Ground ≤ 8°</th><th class="n">Plan holds, +' + slip + ' d</th><th class="n">Both, +' + slip + ' d</th></tr>' +
        sl.classes.map(function (c) { return '<tr><td>' + esc(c.label) + '</td><td class="n">' + num(c.within_99_pct_m) + ' m</td><td class="n">' + pct(c.flat_8deg_pct) + '</td><td class="n">' + pct(c.plan_holds_at_slip_pct) + '</td><td class="n">' + pct(c.both_at_slip_pct) + '</td></tr>'; }).join('') + '</table>' : '') +
      ((!sl.safetouch_available && sl.safetouch_reason) ? '<p class="small">Safe-touchdown chance: ' + esc(sl.safetouch_reason) + '</p>' : '') +
      ((!sl.joint_available && sl.joint_reason) ? '<p class="small">Both: ' + esc(sl.joint_reason) + '</p>' : '') + '</section>');
    // lighting
    var lt = b.lighting;
    out.push('<section><h2>Descent lighting at touchdown (+' + slip + ' d)</h2>' + (lt.available ? '<p>' + day(lt.touchdown_utc) + ': Sun <b>' + num(lt.sun.el_deg, 2) + '°</b> up at azimuth ' + num(lt.sun.az_deg, 1) + '°, ' + num(lt.sun.clear_of_skyline_deg, 2) + '° ' + (lt.sun.above_skyline ? 'clear of' : 'below') + ' the skyline. Coming in from ' + num(lt.approach.from_deg) + '° <span class="tag t-illustrative">illustrative</span>: Sun ' + esc(lt.approach.sun_side) + ' (' + num(lt.approach.sun_from_behind_deg, 1) + '° from straight behind); descent camera ' + (lt.camera.good ? 'good' : 'poor') + '.</p>' +
      (lt.shadow.length ? '<p>Landing spread in shadow: ' + lt.shadow.map(function (c) { return esc(c.label) + ' ' + pct(c.in_shadow_pct); }).join('; ') + '.</p>' : '') : '<p>' + esc(lt.reason) + '</p>') + '</section>');
    // relay
    var rl = b.relay, rh = rl.hours || {};
    out.push('<section><h2>Relay contact</h2>' + (rl.available ? '<p>' + esc(rl.config_text) + ' <span class="tag t-assumed">assumed</span>. In the ' + num(rl.window_hours) + '-hour window: Earth ' + num(rh.earth) + ' h, relay ' + num(rh.relay) + ' h, either ' + num(rh.either) + ' h, none ' + num(rh.none) + ' h. Slip margin with Earth only ' + num(rl.margin_earth_days) + ' d; with Earth or relay ' + num(rl.margin_either_days) + ' d' + (rl.either_ends_because && rl.either_ends_because.length ? ' (then: ' + esc(rl.either_ends_because.join('; ')) + ')' : '') + '.</p>' : '<p>' + esc(rl.reason) + '</p>') + '</section>');
    // alternatives
    var al = b.alternatives;
    out.push('<section><h2>Best alternative sites at +' + slip + ' d</h2>' + (al.available ? '<p class="small">' + al.sites_yes + ' of ' + al.sites_checked + ' sites checked are a clear yes on ' + day(al.touchdown_utc) + '.</p><table><tr><th>#</th><th>Site</th><th>Verdict</th><th class="n">Margin</th><th class="n">Sunlit / Earth</th></tr>' +
      al.rows.map(function (r) { return '<tr><td>' + r.rank + '</td><td>' + esc(r.name) + '</td><td>' + word(r.verdict) + '</td><td class="n">' + (r.slip_margin_days >= 0 ? r.slip_margin_days + ' d' : '–') + '</td><td class="n">' + num(r.sunlit_h) + ' / ' + num(r.earth_h) + ' h</td></tr>'; }).join('') + '</table>' : '<p>' + esc(al.reason) + '</p>') + '</section>');
    // terrain
    var t = b.terrain;
    out.push('<section><h2>NASA terrain grid used</h2><p><b>' + esc(t.product || t.label || '–') + '</b>' + (t.resolution_m ? ' (' + num(t.resolution_m) + ' m cells)' : '') + '. Skyline: ' + esc(t.horizon_label) + '. Slope: ' + esc((t.slope_grids || []).join('; ') || '–') + '.</p><p class="small prov">File: ' + esc(t.provenance_first || t.provenance) + ' (full list in the JSON export)</p></section>');
    // checks
    out.push('<section><h2>Validation checks</h2><ul class="checks">' + b.checks.map(function (c) { return '<li>' + esc(c.name) + ': <b>' + esc(c.result) + '</b></li>'; }).join('') + '</ul></section>');
    out.push('</div>');
    // assumptions & sources
    out.push('<section><h2>Assumptions, rules and limits (every one labelled; full wording in the JSON export)</h2><ul class="fine">' + b.assumptions.map(function (a) { return '<li><span class="tag t-' + esc(a.label) + '">' + esc(a.label) + '</span><span class="full">' + esc(a.text) + '</span><span class="short">' + esc(a.text.length > 105 ? a.text.slice(0, 100).replace(/\s+\S*$/, '') + ' …' : a.text) + '</span></li>'; }).join('') + '</ul></section>');
    out.push('<section><h2>Data sources</h2><ul class="fine srcs">' + b.sources.map(function (s) { return '<li>' + esc(s.label.length > 90 ? s.label.slice(0, 86) + ' …' : s.label) + ': <a class="src" href="' + esc(s.url) + '">' + (/^https?:\/\//.test(s.url) ? '' : '') + '<span class="noprint">' + esc(s.url) + '</span></a></li>'; }).join('') + '</ul></section>');
    out.push('<footer>Every figure on this page comes from the Slipday API (' + esc(b.endpoints.length) + ' endpoints, listed in the JSON export). Lunar south pole; times in UTC. Ephemeris: JPL DE421. Not a flight product.</footer>');
    var el = document.getElementById('brief');
    el.innerHTML = out.join('');
    el.hidden = false;
    document.getElementById('status').hidden = true;
    document.title = 'Slipday brief: ' + (s.friendly_name || s.name) + ', ' + b.inputs.landing_utc.slice(0, 10) + ', slip ' + slip + ' d';
  }

  function load() {
    var q = query();
    var st = document.getElementById('status');
    st.hidden = false; st.textContent = 'Assembling the brief from the Slipday endpoints. The alternatives check can take up to two minutes the first time.';
    document.getElementById('brief').hidden = true;
    fetch('/api/addons/brief?' + q.toString()).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status)); return j; });
    }).then(function (j) { data = j; render(j); window.__briefReady = true; })
      .catch(function (e) { st.textContent = 'The brief could not be made: ' + e.message; window.__briefReady = 'error'; });
  }
  form.addEventListener('submit', function (e) { e.preventDefault(); history.replaceState(null, '', '?' + query().toString()); load(); });
  document.getElementById('download').addEventListener('click', function () { window.print(); });
  document.getElementById('json').addEventListener('click', function () {
    if (!data) return;
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'slipday-brief-' + (data.inputs.site_ref.id || 'site') + '-' + data.inputs.landing_utc.slice(0, 10) + '-slip' + data.inputs.slip_days + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  load();
})();
</script>
</body>
</html>
